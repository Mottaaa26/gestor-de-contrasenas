<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de contraseñas</title>
    <script src="main.js" defer></script>
    <style>
        
        body {
            height: 100%;
            text-align: center;
            font-size: medium;
            background-color: #EEEEEE;
        }

        h1 {
            color: #000;
        }

        .div_tabla {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .tabla_contrasenas {
            text-align: center;
            margin-top: 5%;
            border-collapse: collapse;
            border: 1px solid black;
            width: 50vw;
            outline: #FFF;
            color: #000;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 300px;
            margin: 20px auto;
        }

        .formulario div {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            width: 100%;
            text-align: left;
        }

        .formulario input,
        .formulario textarea {
            padding: 8px;
            box-sizing: border-box;
        }

        .formulario button {
            padding: 10px 20px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <h1>Contraseñas</h1>
    <form id="formulario" class="formulario" action="">
        <div>
            <label for="usuario">Usuario</label>
            <input required id="usuario" type="text">
        </div>
        <div>
            <label for="correo">Correo</label>
            <input required id="correo" type="email">
        </div>
        <div>
            <label for="contrasena">Contraseña</label>
            <input required id="contrasena" type="password">
        </div>
        <div>
            <label for="descripcion">Descripcion</label>
            <textarea required id="descripcion" placeholder="escribe la descripcion del registro"></textarea>
        </div>
        <button type="submit" id="boton_formulario">agregar registro</button>
    </form>
    <div class="div_tabla">
        <table class="tabla_contrasenas">
            <thead>
                <tr>
                    <th>usuario</th>
                    <th>correo</th>
                    <th>contraseña</th>
                    <th>descripcion</th>
                </tr>
            </thead>
            <tbody id="cuerpo">

            </tbody>
        </table>
    </div>
</body>
</html>
